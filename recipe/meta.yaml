{% set name = "perl-moo" %}
{% set version = "2.005005" %}
{% set sha256 = "fb5a2952649faed07373f220b78004a9c6aba387739133740c1770e9b1f4b108" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Moo-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-class-method-modifiers
    - perl-role-tiny
    - perl-sub-quote
  run:
    - perl
    - perl-sub-quote
    - perl-class-method-modifiers
    - perl-role-tiny

test:
  imports:
    - Moo
  commands:
    - perl -we 'use Moo::Role'  # import test fails, not sure why
    # Versions do not match:
    - perl -we 'use Moo::Object'
    - perl -we 'use Moo::sification'
    # These pull in Moose as dep:
    #- perl -we 'use Moo::HandleMoose'
    #- perl -we 'use Moo::HandleMoose::FakeMetaClass'

about:
  home: http://metacpan.org/pod/Moo
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'Minimalist Object Orientation (with Moose compatibility)'

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
